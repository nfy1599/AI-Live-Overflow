name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = no keystore needed)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --update
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK (auto-signed)
        if: github.event.inputs.build_type == 'debug'
        run: |
          gradle assembleDebug --no-daemon

      - name: Build Release APK (needs keystore secrets)
        if: github.event.inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/upload.jks
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/upload.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs -name '*.apk' | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"

      - name: Verify APK signature
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify -v ${{ steps.find_apk.outputs.apk_path }} || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deskpet-apk-${{ github.event.inputs.build_type }}-${{ github.run_id }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7
