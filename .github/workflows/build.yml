name: Build Signed APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --update
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Create keystore from secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload.jks
          echo "✅ Keystore created successfully"
          ls -lh /tmp/upload.jks

      - name: Build APK
        run: |
          gradle clean bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/upload.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            -PbuildType=${{ github.event.inputs.build_type }}

      - name: Find APK artifact
        id: find_apk
        run: |
          APK=$(find app/build/outputs -name '*.apk' | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"

      - name: Sign APK with v2/v3 schemes
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks /tmp/upload.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            ${{ steps.find_apk.outputs.apk_path }}

      - name: Verify APK signature
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify -v \
            ${{ steps.find_apk.outputs.apk_path }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-${{ github.run_id }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7
