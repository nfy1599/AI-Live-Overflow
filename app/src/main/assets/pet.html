se-in-out;\n      }\n\n      /* ===== Juggling packets: parabolic arc ===== */\n      .packet {\n        animation: juggle 1.2s infinite;\n      }\n      .p1 { animation-delay: 0s; fill: #FF5252; }\n      .p2 { animation-delay: -0.4s; fill: #FFC107; }\n      .p3 { animation-delay: -0.8s; fill: #4CAF50; }\n\n      /* (no sweat \u2014 juggling is a steady state, not emergency) */\n\n      /* ===== Keyframes ===== */\n\n      @keyframes breathe {\n        0%, 100% { transform: scale(1, 1) translate(0, 0); }\n        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }\n      }\n\n      @keyframes blink {\n        0%, 10%, 100% { transform: scaleY(1); }\n        5% { transform: scaleY(0.1); }\n      }\n\n      /* Body: center \u2192 left-dip \u2192 center \u2192 right-dip \u2192 center */\n      @keyframes rock {\n        0%, 50%, 100% { transform: rotate(0deg) translateY(0); }\n        25% { transform: rotate(-3deg) translateY(0.3px); }\n        75% { transform: rotate(3deg) translateY(0.3px); }\n      }\n\n      /* Shadow: sway with body */\n      @keyframes shadow-rock {\n        0%, 50%, 100% { transform: scaleX(1); opacity: 0.5; }\n        25% { transform: scaleX(1.03) translateX(-0.3px); opacity: 0.52; }\n        75% { transform: scaleX(1.03) translateX(0.3px); opacity: 0.52; }\n      }\n\n      /* Left arm: up at 25% (catch left), down at 75% */\n      @keyframes arm-jl {\n        0%, 50%, 100% { transform: rotate(20deg); }\n        25% { transform: rotate(35deg); }\n        75% { transform: rotate(5deg); }\n      }\n\n      /* Right arm: down at 25%, up at 75% (catch right) */\n      @keyframes arm-jr {\n        0%, 50%, 100% { transform: rotate(-20deg); }\n        25% { transform: rotate(-5deg); }\n        75% { transform: rotate(-35deg); }\n      }\n\n      /* Eyes: track ball arc left-right */\n      @keyframes eye-track {\n        0%, 100% { transform: translate(-1px, -1px); }\n        15% { transform: translate(0, -1.5px); }\n        30% { transform: translate(1px, -1px); }\n        45% { transform: translate(1px, 0.5px); }\n        50% { transform: translate(1px, -1px); }\n        65% { transform: translate(0, -1.5px); }\n        80% { transform: translate(-1px, -1px); }\n        90% { transform: translate(-1px, 0.5px); }\n      }\n\n      /* Juggle: parabolic arc between hands, hang at top\n         Packet origin is x=-1 y=-1 (2x2 rect center ~0,0)\n         Left hand: x~1, y~10  \u2192 translate(2, 10)\n         Right hand: x~14, y~10 \u2192 translate(14, 10)\n         Arc peak: y ~ -1 (well above head) */\n      @keyframes juggle {\n        0%   { transform: translate(2px, 10px); }\n        8%   { transform: translate(4px, 4px); }\n        18%  { transform: translate(6px, 0px); }\n        30%  { transform: translate(8px, -1px); }\n        42%  { transform: translate(10px, 0px); }\n        50%  { transform: translate(14px, 10px); }\n        58%  { transform: translate(12px, 4px); }\n        68%  { transform: translate(10px, 0px); }\n        80%  { transform: translate(8px, -1px); }\n        92%  { transform: translate(4px, 4px); }\n        100% { transform: translate(2px, 10px); }\n      }\n    </style>\n  </defs>\n\n  <!-- Ground Shadow -->\n  <rect class=\"shadow-anim\" x=\"3\" y=\"15\" width=\"9\" height=\"1\" fill=\"#000\" opacity=\"0.5\"/>\n\n  <!-- Juggling Packets -->\n  <g>\n    <!-- Red ball -->\n    <g class=\"packet p1\">\n      <circle cx=\"0\" cy=\"0\" r=\"1.2\" fill=\"#FF5252\"/>\n      <circle cx=\"-0.35\" cy=\"-0.35\" r=\"0.45\" fill=\"#FF8A80\" opacity=\"0.7\"/>\n      <circle cx=\"0.3\" cy=\"0.4\" r=\"0.6\" fill=\"#D32F2F\" opacity=\"0.3\"/>\n    </g>\n    <!-- Yellow ball -->\n    <g class=\"packet p2\">\n      <circle cx=\"0\" cy=\"0\" r=\"1.2\" fill=\"#FFC107\"/>\n      <circle cx=\"-0.35\" cy=\"-0.35\" r=\"0.45\" fill=\"#FFE082\" opacity=\"0.7\"/>\n      <circle cx=\"0.3\" cy=\"0.4\" r=\"0.6\" fill=\"#FFA000\" opacity=\"0.3\"/>\n    </g>\n    <!-- Green ball -->\n    <g class=\"packet p3\">\n      <circle cx=\"0\" cy=\"0\" r=\"1.2\" fill=\"#4CAF50\"/>\n      <circle cx=\"-0.35\" cy=\"-0.35\" r=\"0.45\" fill=\"#81C784\" opacity=\"0.7\"/>\n      <circle cx=\"0.3\" cy=\"0.4\" r=\"0.6\" fill=\"#388E3C\" opacity=\"0.3\"/>\n    </g>\n  </g>\n\n  <!-- Static Legs -->\n  <g fill=\"#DE886D\">\n    <rect x=\"3\" y=\"13\" width=\"1\" height=\"2\"/>\n    <rect x=\"5\" y=\"13\" width=\"1\" height=\"2\"/>\n    <rect x=\"9\" y=\"13\" width=\"1\" height=\"2\"/>\n    <rect x=\"11\" y=\"13\" width=\"1\" height=\"2\"/>\n  </g>\n\n  <!-- Upper Body -->\n  <g class=\"body-rock\">\n    <g id=\"accessory-anchor\" class=\"breathe\">\n      <!-- Torso -->\n      <rect x=\"2\" y=\"6\" width=\"11\" height=\"7\" fill=\"#DE886D\"/>\n\n      <!-- Left Arm -->\n      <g class=\"arm-juggle-l\">\n        <rect x=\"0\" y=\"9\" width=\"2\" height=\"2\" fill=\"#DE886D\"/>\n      </g>\n\n      <!-- Right Arm -->\n      <g class=\"arm-juggle-r\">\n        <rect x=\"13\" y=\"9\" width=\"2\" height=\"2\" fill=\"#DE886D\"/>\n      </g>\n\n      <!-- Eyes -->\n      <g class=\"eye-track\" fill=\"#000\">\n        <g class=\"blink\">\n          <rect x=\"4\" y=\"8\" width=\"1\" height=\"2\"/>\n          <rect x=\"10\" y=\"8\" width=\"1\" height=\"2\"/>\n        </g>\n      </g>\n\n    </g>\n  </g>\n</svg>\n", "clawd-working-sweeping": "<svg width=\"130\" height=\"130\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"-15 -25 45 45\" >\n  <defs>\n    <style>\n      /* ===== Independent sub-animations ===== */\n      .breathe {\n        transform-origin: 7.5px 13px;\n        animation: breathe 3.2s infinite ease-in-out;\n      }\n      .blink {\n        transform-origin: 7.5px 9px;\n        animation: blink 4s infinite;\n      }\n\n      /* ===== Main 10s story arc ===== */\n      .body-lean {\n        transform-origin: 7.5px 15px;\n        animation: body-lean 10s infinite ease-in-out;\n      }\n      .shadow-anim {\n        transform-origin: 7.5px 15.5px;\n        animation: shadow-anim 10s infinite ease-in-out;\n      }\n      .arm-r {\n        transform-origin: 14px 10px;\n        animation: arm-right 10s infinite ease-in-out;\n      }\n      .arm-l {\n        transform-origin: 1px 10px;\n        animation: arm-left 10s infinite ease-in-out;\n      }\n      .eyes-dir {\n        animation: eye-dir 10s infinite ease-in-out;\n      }\n\n      /* Dust particles */\n      .dust { opacity: 0; }\n      .dust-1 { animation: dust1 10s infinite; }\n      .dust-2 { animation: dust2 10s infinite; }\n      .dust-3 { animation: dust3 10s infinite; }\n\n      /* Sweat drops */\n      .sweat { opacity: 0; }\n      .sweat-1 { animation: sweat1 10s infinite; }\n      .sweat-2 { animation: sweat2 10s infinite; }\n\n      /* ===== Keyframes ===== */\n      @keyframes breathe {\n        0%, 100% { transform: scale(1, 1) translate(0, 0); }\n        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }\n      }\n\n      @keyframes blink {\n        0%, 10%, 100% { transform: scaleY(1); }\n        5% { transform: scaleY(0.1); }\n      }\n\n      /* Body: idle \u2192 lean \u2192 straighten \u2192 lean \u2192 return to idle */\n      @keyframes body-lean {\n        0%, 1%   { transform: translate(0, 0) rotate(0deg); }\n        5%, 38%  { transform: translate(1px, 0) rotate(6deg); }\n        43%, 57% { transform: translate(0, 0) rotate(2deg); }\n        62%, 85% { transform: translate(1px, 0) rotate(6deg); }\n        90%      { transform: translate(0.5px, 0) rotate(3deg); }\n        100%     { transform: translate(0, 0) rotate(0deg); }\n      }\n\n      @keyframes shadow-anim {\n        0%, 1%   { transform: scaleX(1); opacity: 0.5; }\n        5%, 38%  { transform: scaleX(1.08); opacity: 0.55; }\n        43%, 57% { transform: scaleX(1); opacity: 0.5; }\n        62%, 85% { transform: scaleX(1.08); opacity: 0.55; }\n        90%      { transform: scaleX(1.03); opacity: 0.52; }\n        100%     { transform: scaleX(1); opacity: 0.5; }\n      }\n\n      /* Right arm + broom: idle \u2192 3 sweeps \u2192 relax \u2192 3 sweeps \u2192 hold\n         Forward stroke (35 to -15) is faster than return (-15 to 35) */\n      @keyframes arm-right {\n        0%, 1%   { transform: rotate(0deg); }\n        4%       { transform: rotate(35deg); }\n        /* Phase A: stroke 1 */\n        7%       { transform: rotate(35deg); }\n        10%      { transform: rotate(-15deg); }\n        /* return */\n        15%      { transform: rotate(35deg); }\n        /* stroke 2 */\n        18%      { transform: rotate(-15deg); }\n        /* return */\n        23%      { transform: rotate(35deg); }\n        /* stroke 3 */\n        26%      { transform: rotate(-15deg); }\n        30%      { transform: rotate(10deg); }\n        /* Pause: arm relaxed */\n        36%, 57% { transform: rotate(0deg); }\n        /* Phase B: stroke 1 */\n        61%      { transform: rotate(35deg); }\n        64%      { transform: rotate(-15deg); }\n        /* stroke 2 */\n        69%      { transform: rotate(35deg); }\n        72%      { transform: rotate(-15deg); }\n        /* stroke 3 */\n        77%      { transform: rotate(35deg); }\n        80%      { transform: rotate(-15deg); }\n        85%      { transform: rotate(10deg); }\n        90%      { transform: rotate(5deg); }\n        100%     { transform: rotate(0deg); }\n      }\n\n      /* Left arm: idle \u2192 scratch head during pause \u2192 idle */\n      @keyframes arm-left {\n        0%, 41%  { transform: translate(0, 0) rotate(0deg); }\n        44%      { transform: translate(2px, -4px) rotate(35deg); }\n        46%      { transform: translate(2.5px, -5px) rotate(50deg); }\n        48%      { transform: translate(2px, -4px) rotate(35deg); }\n        50%      { transform: translate(2.5px, -5px) rotate(50deg); }\n        52%      { transform: translate(2px, -4px) rotate(35deg); }\n        55%, 100%{ transform: translate(0, 0) rotate(0deg); }\n      }\n\n      /* Eyes: ahead \u2192 look down \u2192 ahead (pause) \u2192 down \u2192 return to ahead */\n      @keyframes eye-dir {\n        0%, 2%   { transform: translate(0, 0); }\n        5%, 38%  { transform: translate(1px, 1px); }\n        43%, 57% { transform: translate(0, 0); }\n        62%, 85% { transform: translate(1px, 1px); }\n        90%      { transform: translate(0.5px, 0.5px); }\n        100%     { transform: translate(0, 0); }\n      }\n\n      /* Dust puffs at end of forward strokes */\n      @keyframes dust1 {\n        0%, 8%   { opacity: 0; transform: translate(17px, 15px) scale(0); }\n        10%      { opacity: 0.6; transform: translate(17px, 15px) scale(1); }\n        16%      { opacity: 0; transform: translate(20px, 13.5px) scale(0.3); }\n        17%, 62% { opacity: 0; }\n        64%      { opacity: 0.6; transform: translate(17px, 15px) scale(1); }\n        70%      { opacity: 0; transform: translate(20px, 13.5px) scale(0.3); }\n        71%, 100%{ opacity: 0; }\n      }\n      @keyframes dust2 {\n        0%, 16%  { opacity: 0; transform: translate(16px, 16px) scale(0); }\n        18%      { opacity: 0.5; transform: translate(16px, 16px) scale(1); }\n        24%      { opacity: 0; transform: translate(19px, 14.5px) scale(0.3); }\n        25%, 70% { opacity: 0; }\n        72%      { opacity: 0.5; transform: translate(16px, 16px) scale(1); }\n        78%      { opacity: 0; transform: translate(19px, 14.5px) scale(0.3); }\n        79%, 100%{ opacity: 0; }\n      }\n      @keyframes dust3 {\n        0%, 24%  { opacity: 0; transform: translate(18px, 15.5px) scale(0); }\n        26%      { opacity: 0.5; transform: translate(18px, 15.5px) scale(1); }\n        32%      { opacity: 0; transform: translate(21px, 14px) scale(0.3); }\n        33%, 78% { opacity: 0; }\n        80%      { opacity: 0.5; transform: translate(18px, 15.5px) scale(1); }\n        86%      { opacity: 0; transform: translate(21px, 14px) scale(0.3); }\n        87%, 100%{ opacity: 0; }\n      }\n\n      /* Sweat during Phase A sweeping */\n      @keyframes sweat1 {\n        0%, 8%   { opacity: 0; transform: translate(0, 0) scale(0); }\n        10%      { opacity: 1; transform: translate(0, 0) scale(1); }\n        20%      { opacity: 0; transform: translate(-5px, -5px) scale(0.5); }\n        21%, 100%{ opacity: 0; }\n      }\n      @keyframes sweat2 {\n        0%, 16%  { opacity: 0; transform: translate(0, 0) scale(0); }\n        18%      { opacity: 1; transform: translate(0, 0) scale(1); }\n        28%      { opacity: 0; transform: translate(-4px, -6px) scale(0.4); }\n        29%, 100%{ opacity: 0; }\n      }\n    </style>\n  </defs>\n\n  <!-- Mirrored: character faces left for visible broom -->\n  <g transform=\"translate(15, 0) scale(-1, 1)\">\n\n    <!-- Ground Shadow -->\n    <rect class=\"shadow-anim\" x=\"3\" y=\"15\" width=\"9\" height=\"1\" fill=\"#000\" opacity=\"0.5\"/>\n\n    <!-- Dust particles (ground level, outside body group) -->\n    <rect class=\"dust dust-1\" x=\"0\" y=\"0\" width=\"1.5\" height=\"1.5\" fill=\"#9E9E9E\"/>\n    <rect class=\"dust dust-2\" x=\"0\" y=\"0\" width=\"1\" height=\"1\" fill=\"#B0BEC5\"/>\n    <rect class=\"dust dust-3\" x=\"0\" y=\"0\" width=\"1.2\" height=\"1.2\" fill=\"#9E9E9E\"/>\n\n    <!-- Static Legs -->\n    <g fill=\"#DE886D\">\n      <rect x=\"3\" y=\"13\" width=\"1\" height=\"2\"/>\n      <rect x=\"5\" y=\"13\" width=\"1\" height=\"2\"/>\n      <rect x=\"9\" y=\"13\" width=\"1\" height=\"2\"/>\n      <rect x=\"11\" y=\"13\" width=\"1\" height=\"2\"/>\n    </g>\n\n    <!-- Upper Body -->\n    <g class=\"body-lean\">\n\n      <!-- Sweat drops (inside body group, move with lean) -->\n      <g transform=\"translate(1, 5)\">\n        <g class=\"sweat sweat-1\" fill=\"#40C4FF\">\n          <rect x=\"0\" y=\"1\" width=\"1.5\" height=\"1.5\"/>\n          <rect x=\"0.25\" y=\"0\" width=\"1\" height=\"1\"/>\n        </g>\n      </g>\n      <g transform=\"translate(-0.5, 7)\">\n        <g class=\"sweat sweat-2\" fill=\"#40C4FF\">\n          <rect x=\"0\" y=\"0.5\" width=\"1\" height=\"1\"/>\n          <rect x=\"0.15\" y=\"0\" width=\"0.7\" height=\"0.7\"/>\n        </g>\n      </g>\n\n      <!-- Breathing -->\n      <g id=\"accessory-anchor\" class=\"breathe\">\n\n        <!-- Torso -->\n        <rect x=\"2\" y=\"6\" width=\"11\" height=\"7\" fill=\"#DE886D\"/>\n\n        <!-- Left Arm (scratch head during pause) -->\n        <g class=\"arm-l\">\n          <rect x=\"0\" y=\"9\" width=\"2\" height=\"2\" fill=\"#DE886D\"/>\n        </g>\n\n        <!-- Right Arm + Broom (attached, sweeps together) -->\n        <g class=\"arm-r\">\n          <rect x=\"13\" y=\"9\" width=\"2\" height=\"2\" fill=\"#DE886D\"/>\n          <!-- Broom Handle -->\n          <rect x=\"13.5\" y=\"11\" width=\"1\" height=\"3.5\" fill=\"#795548\"/>\n          <!-- Broom Bristles -->\n          <rect x=\"12\" y=\"14.5\" width=\"4\" height=\"1.5\" fill=\"#FFC107\"/>\n          <!-- Bristle texture (vertical lines, bottom up, faint, gap at edges) -->\n          <rect x=\"12.5\" y=\"14.85\" width=\"0.35\" height=\"0.8\" fill=\"#C99700\" opacity=\"0.3\"/>\n          <rect x=\"13.2\" y=\"14.8\"  width=\"0.3\"  height=\"0.9\" fill=\"#C99700\" opacity=\"0.35\"/>\n          <rect x=\"13.8\" y=\"14.85\" width=\"0.35\" height=\"0.8\" fill=\"#C99700\" opacity=\"0.3\"/>\n          <rect x=\"14.5\" y=\"14.8\"  width=\"0.3\"  height=\"0.85\" fill=\"#C99700\" opacity=\"0.35\"/>\n        </g>\n\n        <!-- Eyes -->\n        <g class=\"eyes-dir\" fill=\"#000\">\n          <g class=\"blink\">\n            <rect x=\"4\" y=\"8\" width=\"1\" height=\"2\"/>\n            <rect x=\"10\" y=\"8\" width=\"1\" height=\"2\"/>\n          </g>\n        </g>\n\n      </g>\n    </g>\n\n  </g>\n</svg>\n", "clawd-working-typing-boss": "<svg width=\"130\" height=\"130\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"-15 -25 45 45\" >\n  <!-- \u2705 FINAL \u00b7 clawd \u8001\u677f\u76ae\u80a4\u5b9a\u7a3f\u7248 (2026-04-16 \u9e7f\u9e7f\u786e\u8ba4)\n       \u5b9a\u7a3f = v13. \u540e\u7eed v14/v15 \u5c1d\u8bd5\u52a0\u58a8\u955c\u53cd\u5149\u6ed1\u52a8\u88ab\u5426, \u753b\u86c7\u6dfb\u8db3, \u7559\u6863\u4e0d\u5220\n\n       \u52a8\u4f5c\u6e05\u5355:\n         - \u8e31\u6b65 pacing gait (\u5de6\u4e24\u817f / \u53f3\u4e24\u817f \u4ea4\u66ff\u62ac, \u5468\u671f 2.2s \u6c14\u5b9a\u795e\u95f2)\n         - body-walk \u8eab\u4f53\u8d77\u4f0f + \u5de6\u53f3\u91cd\u5fc3\u8f6c\u79fb (\u9501\u76f8\u8e31\u6b65)\n         - \u91d1\u5e01\u6446 (pivot \u91d1\u5e01\u9876\u90e8\u6302\u70b9, rotate \u00b13\u00b0, \u9501\u76f8 body-walk)\n         - \u96ea\u8304\u6446 (pivot \u624b\u63e1\u7aef, rotate -150\u00b0\u00b13\u00b0, \u5468\u671f 2.8s \u4e92\u8d28\u81ea\u4e3b\u8282\u594f)\n         - \u5f71\u5b50\u8ddf\u968f (translateX \u8ddf body-walk, scale+opacity \u8109\u52a8)\n         - \u4ee3\u7801\u70df\u96fe (8 \u7b26\u53f7\u4ece\u706b\u661f\u98d8\u8d77, \u5df2\u5728 v10 \u4fee\u597d\u521d\u59cb\u5e27 bug)\n         - \u5916\u5c42 rotate(+1\u00b0) \u514b\u5236\u62ac\u5934\u6c14\u573a\n         - \u58a8\u955c / V \u5f62\u91d1\u94fe\u6761 / \u96ea\u8304\u706b\u661f\u660e\u706d (v8 / v10 \u7ee7\u627f)\n\n       v13 \u00b7 v12 \u57fa\u7840\u4e0a\u4fee\u5f71\u5b50 (\u8ba9\u5f71\u5b50\u8ddf\u8eab\u4f53\u8d70 + \u6539\u5bf9\u76f8\u4f4d)\n       v12 \u2192 v13 \u4fee\u6539:\n         1. \u5f71\u5b50\u52a0 translateX \u8ddf\u968f body-walk \u5de6\u53f3\u6643:\n            - \u8eab\u4f53 25% \u5411\u53f3\u504f +0.15 \u2192 \u5f71\u5b50\u4e5f +0.15\n            - \u8eab\u4f53 75% \u5411\u5de6\u504f -0.15 \u2192 \u5f71\u5b50\u4e5f -0.15\n         2. scale/opacity \u76f8\u4f4d\u4fee\u6b63:\n            - v12 \u9519\u5728: \u8eab\u4f53\u62ac\u8d77\u77ac\u95f4 (25%/75%) \u5f71\u5b50\u53d8\u5927+\u6df1, \u53cd\u7269\u7406\n            - v13 \u6539: \u8eab\u4f53\u4e0b\u6c89\u77ac\u95f4 (0%/50%/100%) \u5f71\u5b50\u53d8\u5927+\u6df1 (\u8d34\u5730\u91cd, \u538b\u5f97\u6df1)\n                     \u8eab\u4f53\u62ac\u8d77\u77ac\u95f4 (25%/75%) \u5f71\u5b50\u53d8\u5c0f+\u6d45 (\u79bb\u5730\u8f7b, \u5f71\u5b50\u6536\u655b)\n         3. \u5e45\u5ea6\u4fdd\u6301\u514b\u5236 (scale \u00b11.5%, opacity 0.5\u21940.52) \u2014 \u8eab\u4f53\u672c\u8eab\u8d77\u4f0f\u5c31\u5c0f\n\n       \u5176\u4ed6\u4fdd\u7559 v12 (\u8e31\u6b65 pacing gait / \u91d1\u5e01\u6446 / \u96ea\u8304\u6446 / \u4ee3\u7801\u70df\u96fe)\n\n       v11 \u2192 v12 \u4fee\u6539:\n         1. \u91d1\u5e01\u6446 (coin-sway):\n            - pivot \u91d1\u5e01\u9876\u90e8\u6302\u70b9 (12.7, 10.9275) \u2014 \u94fe\u6761\u6c47\u5408\u70b9, \u6a21\u62df\u4ece\u94fe\u6761\u6302\u4e0b\n            - rotate \u00b13\u00b0, \u5468\u671f 1.1s + alternate = \u6765\u56de 2.2s \u9501\u76f8 body-walk\n            - \u91d1\u5e01\u5916\u5c42\u5305\u4e00\u5c42 g.coin-sway, \u5185\u5c42\u4fdd\u6301\u539f translate+scale\n         2. \u96ea\u8304\u6446 bug \u4fee\u590d:\n            - v11 \u7528 transform-box: fill-box + \u767e\u5206\u6bd4 origin\n              SVG <g> \u4e0a\u6d4f\u89c8\u5668 fill-box \u652f\u6301\u4e0d\u4e00\u81f4, \u53ef\u80fd\u5bfc\u81f4 animation \u4e0d\u751f\u6548\n            - \u6539\u6210 carrying/pack-swing \u540c\u6b3e\u7684\u7edd\u5bf9\u5750\u6807 origin (1px 10.5px), \u7a33\u59a5\n            - \u96ea\u8304\u7ed3\u6784\u91cd\u6784:\n              * \u53bb\u6389\u5916\u5c42 <g transform=\"translate(1 10)\">, rects \u5750\u6807\u76f4\u63a5 shift \u5230 (1..6, 10..11)\n              * \u5185\u5c42\u65b0\u589e <g transform=\"rotate(-150 1 10.5)\"> \u505a\u57fa\u7840 -150\u00b0 \u65cb\u8f6c\n              * \u5916\u5c42 .cigar-sway \u7528 CSS \u53e0\u52a0 \u00b13\u00b0 \u65cb\u8f6c, pivot \u540c\u6837 (1, 10.5)\n              * \u4e24\u5c42 rotate \u7ed5\u540c\u4e00 pivot, \u77e9\u9635\u590d\u5408 = rotate(-150 \u00b1 3\u00b0)\n         3. \u706b\u661f\u5168\u5c40\u5750\u6807 (-2.9, 8.25) \u4e0d\u53d8 (\u9a8c\u7b97: (5.5, 10.5) \u7ed5 (1, 10.5) rotate(-150) = (-2.9, 8.25))\n            codesmoke \u8d77\u70b9\u4fdd\u6301\u4e0d\u53d8\n\n       \u4e3a\u4ec0\u4e48\u91d1\u5e01 pivot \u5728\u9876\u90e8\u800c\u4e0d\u662f\u4e2d\u5fc3:\n         \u7269\u7406\u4e0a\u91d1\u5e01\u662f\u4ece\u94fe\u6761\u6302\u70b9\u540a\u4e0b, \u6446\u52a8\u8f74 = \u94fe\u6761\u672b\u7aef = \u91d1\u5e01\u9876\u90e8\u4e2d\u5fc3\n         pivot \u653e\u91d1\u5e01\u5e95\u90e8\u4f1a\u770b\u8d77\u6765\u50cf\"\u91d1\u5e01\u4ece\u5e95\u90e8\u88ab\u9489\u4f4f\", \u53cd\u7269\u7406\n\n       \u4e3a\u4ec0\u4e48\u91d1\u5e01\u5468\u671f\u5bf9\u9f50 body-walk (2.2s) \u800c\u4e0d\u662f\u9519\u5f00:\n         \u91d1\u5e01\u6302\u5728\u8eab\u4e0a, \u8d70\u8def\u65f6\u81ea\u7136\u5e94\u548c\u8eab\u4f53\u5f8b\u52a8, \u4e0d\u662f\u72ec\u7acb\u8282\u594f\n         \u9519\u5f00\u53cd\u800c\u663e\u5f97\u91d1\u5e01\u6709\u81ea\u4e3b\u610f\u8bc6, \u8fdd\u548c\n         \u96ea\u8304\u662f\"\u5927\u4f6c\u4e3b\u52a8\u53fc\u7684\", \u6709\u81ea\u4e3b\u8282\u594f (2.8s \u4e92\u8d28) \u624d\u50cf\"\u60a0\u7740\u62bd\"\n\n       \u5176\u4ed6\u4fdd\u7559 v11 (\u8e31\u6b65 pacing gait / body-walk / \u9634\u5f71\u8109\u52a8 / \u4ee3\u7801\u70df\u96fe) -->\n\n  <defs>\n    <filter id=\"smoke-glow\" x=\"-100%\" y=\"-100%\" width=\"300%\" height=\"300%\">\n      <feGaussianBlur stdDeviation=\"0.3\" result=\"glow\"/>\n      <feMerge>\n        <feMergeNode in=\"glow\"/>\n        <feMergeNode in=\"glow\"/>\n        <feMergeNode in=\"SourceGraphic\"/>\n      </feMerge>\n    </filter>\n    <style>\n      .body-walk {\n        transform-origin: 7.5px 15px;\n        animation: body-walk 2.2s infinite ease-in-out;\n      }\n      .step-left {\n        animation: step-left 2.2s infinite ease-in-out;\n      }\n      .step-right {\n        animation: step-right 2.2s infinite ease-in-out;\n      }\n      .coin-sway {\n        transform-origin: 12.7px 10.9275px;\n        animation: coin-sway 1.1s infinite alternate ease-in-out;\n      }\n      .cigar-sway {\n        transform-origin: 1px 10.5px;\n        animation: cigar-sway 2.8s infinite alternate ease-in-out;\n      }\n      .shadow-pulse {\n        transform-origin: 7.5px 15.5px;\n        animation: shadow
