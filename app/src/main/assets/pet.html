<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  body { width: 100vw; height: 100vh; display: flex; align-items: flex-end; justify-content: center; }
  #bubble {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    min-width: 60px; max-width: 160px;
    background: rgba(255,255,255,0.95);
    border: 2px solid #ffb6d9; border-radius: 16px;
    padding: 8px 12px; font-size: 12px; color: #333;
    box-shadow: 0 4px 12px rgba(255,105,180,0.3);
    opacity: 0; transition: opacity 0.3s; text-align: center; white-space: nowrap;
  }
  #bubble.show { opacity: 1; }
  img { width: 90px; height: auto; display: block; }
</style>
</head>
<body>
<div id="bubble">你好呀，我是你的桌宠～</div>
<img id="pet" src="pet.png" alt="桌宠">
<script>
  var petEngine = petEngine || {};
  function showBubble(text) {
    var b = document.getElementById('bubble');
    b.textContent = text;
    b.style.whiteSpace = 'nowrap';
    b.classList.add('show');
    clearTimeout(petEngine._t);
    petEngine._t = setTimeout(function(){ b.classList.remove('show'); }, 4000);
  }
  petEngine.showMessage = showBubble;
  petEngine.onTap = function(){ showBubble('嘿嘿，摸我干嘛～'); };
  petEngine.onDoubleTap = function(){ showBubble('不许偷偷点两下！'); };
  petEngine.onLongPress = function(){ showBubble('好啦好啦，我听话～'); };
  showBubble('你好呀，我是你的桌宠～');
</script>
</body>
</html>
